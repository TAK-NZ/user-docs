name: Verify Docs Build

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict --config-file ./mkdocs.yml
