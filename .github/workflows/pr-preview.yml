name: Verify Docs Build

on:
  pull_request:
    branches: ["main"]

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: "pr-preview-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-workflows:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
        with:
          fail_level: error

  build:
    name: Build MkDocs site (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        env:
          # Enables the htmlproofer plugin (checks internal links, anchors and
          # images in the rendered HTML) only for CI builds; local `mkdocs
          # serve` stays fast by default.
          ENABLED_HTMLPROOFER: "true"
        run: mkdocs build --strict --config-file ./mkdocs.yml --site-dir ./dist

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./dist/
          retention-days: 7

  check-external-links:
    name: Check external links
    # Best-effort only: external sites can be flaky or block bots, so this
    # check reports broken links without blocking the merge.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ./dist

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --cache --max-cache-age 1d
            --no-progress
            ./dist
          fail: false
          jobSummary: true
